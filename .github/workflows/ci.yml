name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # Volontairement « latest-stable » et non une version figée : un
          # numéro codé en dur casse la CI dès que le runner est mis à jour,
          # et la version locale de référence est notée dans le README.
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      # Un seul point d'entrée, identique en local : « vert en CI » et « vert
      # sur ma machine » doivent vouloir dire la même chose.
      - name: Verify
        run: Scripts/ci.sh

  # Les tests UI durent une trentaine de minutes : on ne les impose pas à
  # chaque commit, mais ils ne doivent pas dériver pour autant.
  ui:
    runs-on: macos-15
    timeout-minutes: 90
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'ui-tests')
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Verify with UI tests
        run: Scripts/ci.sh --with-ui
