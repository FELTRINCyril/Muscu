name: Muscu
options:
  bundleIdPrefix: com.cyril
  deploymentTarget:
    iOS: "18.0"
packages:
  MuscuEngine:
    path: Packages/MuscuEngine
targets:
  Muscu:
    type: application
    platform: iOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: MuscuEngine
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: Muscu
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ONLY_ACTIVE_ARCH: YES
  MuscuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Muscu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: MuscuUITests
        TEST_TARGET_NAME: Muscu
schemes:
  Muscu:
    build:
      targets:
        Muscu: all
        MuscuUITests: [test]
    test:
      targets:
        - MuscuUITests

