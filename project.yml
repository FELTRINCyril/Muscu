name: Muscu
options:
  bundleIdPrefix: com.cyril
  deploymentTarget:
    iOS: "18.0"
packages:
  MuscuEngine:
    path: Packages/MuscuEngine
targets:
  Muscu:
    type: application
    platform: iOS
    sources: [App/Sources, App/Resources]
    dependencies:
      - package: MuscuEngine
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        # Acces Calendrier : FACULTATIF. L'application fonctionne entierement
        # sans cette permission ; elle n'est demandee qu'au moment ou
        # l'utilisateur exporte lui-meme une seance vers son calendrier.
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: >-
          Muscu ajoute vos séances planifiées au calendrier que vous choisissez,
          et ne modifie que les événements qu’il a lui-même créés.
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: Muscu
        # 1 = iPhone, 2 = iPad. L'application est universelle depuis la
        # phase 5 ; la navigation s'adapte a la largeur (onglets / barre
        # laterale) sans dupliquer la moindre regle metier.
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          ONLY_ACTIVE_ARCH: YES
  MuscuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Muscu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: MuscuUITests
        TEST_TARGET_NAME: Muscu
  MuscuTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Muscu
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        PRODUCT_NAME: MuscuTests
schemes:
  Muscu:
    build:
      targets:
        Muscu: all
        MuscuTests: [test]
        MuscuUITests: [test]
    test:
      targets:
        - MuscuTests
        - MuscuUITests
